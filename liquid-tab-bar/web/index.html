<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Liquid tab bar demo</title>
<link rel="stylesheet" href="liquid-tab-bar.css">
<style>body{margin:0;background:#0b0b0d;color:#eee;font:16px/1.6 system-ui,sans-serif}section{min-height:90vh;padding:48px 20px;border-bottom:1px solid #222}h2{margin:0 0 8px}</style></head><body>
<section id="home"><h2>Home</h2><p>Scroll down: the bar shrinks to a pill. Scroll up or tap the pill to bring it back. Drag across the bar to move the lens.</p></section>
<section id="search"><h2>Search</h2></section><section id="inbox"><h2>Inbox</h2></section><section id="me"><h2>Me</h2></section>
<div class="ltb-wrap"><nav class="ltb" aria-label="Sections">
<a href="#home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg><span>Home</span></a>
<a href="#search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Search</span></a>
<a href="#inbox"><svg viewBox="0 0 24 24"><path d="M4 13l2.5-7h11L20 13v5a1 1 0 01-1 1H5a1 1 0 01-1-1zM4 13h4.5l1 2h5l1-2H20"/></svg><span>Inbox</span></a>
<a href="#me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.7 3.1-6 7-6s7 2.3 7 6"/></svg><span>Me</span></a>
</nav></div>
<script src="liquid-tab-bar.js"></script><script>new LiquidTabBar(document.querySelector(".ltb"),{onChange:function(i,a){console.log("tab",i)}});</script></body></html>
